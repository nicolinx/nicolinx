name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  push:
    paths:
      - ".github/workflows/readme-stats.yml" # Run any time this file is modified
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=calm
          path: profile/streak.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # [![GitHub Stats](https://github-stats-extended.vercel.app/api?username=nicolinx&show_icons=true&include_all_commits=true&theme=calm)](https://github-stats-extended.vercel.app/api?username=nicolinx&show_icons=true&include_all_commits=true&theme=calm)
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=calm&hide=contribs
          path: profile/stats.svg
          token: ${{ secrets.METRICS_TOKEN }}

      # [![GitHub Stats](https://github-stats-extended.vercel.app/api/top-langs?username=nicolinx&layout=compact&langs_count=6&theme=calm)](https://github-stats-extended.vercel.app/api/top-langs?username=nicolinx&layout=compact&langs_count=6&theme=calm)
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=6&theme=calm
          path: profile/top-langs.svg
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
